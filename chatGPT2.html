<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT API Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    
    #chatContainer {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
    }
    
    #chatForm {
      display: flex;
      flex-direction: column;
    }
    
    #prompt {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #0056b3;
    }
    
    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
    }
    
    .user-message {
      background-color: #e7f3ff;
      align-self: flex-start;
    }
    
    .bot-message {
      background-color: #f1f1f1;
      align-self: flex-end;
    }
    
    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    
    code {
      background: #f0f0f0;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div id="chatContainer">
    <h1>ChatGPT API Demo</h1>
    <div id="chatLog"></div>
    <form id="chatForm">
      <textarea id="prompt" rows="4" placeholder="Enter your prompt" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    const apiKey = 'sk-None-nIEn5xvHFEUoRkzIJqZAT3BlbkFJQ75jwYzrFw5EyXJV5wnK';
    document.getElementById('chatForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      const prompt = document.getElementById('prompt').value;
      addMessage(prompt, 'user-message');
      document.getElementById('prompt').value = '';

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gpt-3.5-turbo',
            messages: [{
              role: 'system',
              content: 'You are a helpful assistant.'
            }, {
              role: 'user',
              content: prompt
            }]
          })
        });

        const data = await response.json();
        const markdownContent = data.choices[0].message.content;
        const htmlContent = marked.parse(markdownContent, {
          highlight: function(code, lang) {
            const validLanguage = hljs.getLanguage(lang) ? lang : 'plaintext';
            return hljs.highlight(validLanguage, code).value;
          }
        });
        addMessage(htmlContent, 'bot-message');
      } catch (error) {
        addMessage(`Error: ${error.message}`, 'bot-message');
      }
    });

    function addMessage(content, className) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${className}`;
      messageDiv.innerHTML = content;
      document.getElementById('chatLog').appendChild(messageDiv);

      // Re-apply syntax highlighting
      document.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
    }
  </script>
</body>

</html>
